<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="photos-grid" id="photosGrid"></div>
    <div class="floating-hearts" id="hearts"></div>
    <div class="container">
        <div class="arianita">Arianita</div>
        <div class="heart">❤</div>
        <h1 id="forYou">For You</h1>
        <p class="subtitle">
            <span class="arrow">↓</span><br>
            una playlist para ti <br>
            <a href="https://open.spotify.com/playlist/0APmbBYm2ZSCUVCOrk3QAn?si=NrmsTLzMRaO0KnOAnRrsuQ&pi=SBYHFhhSRuumz" target="_blank">abrir en Spotify</a>
        </p>
        <div class="aileen">— Aileen</div>
    </div>

    <script>
        (function() {
            for (let i = 0; i < 120; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (Math.random() * 2 + 2) + 's';
                document.getElementById('stars').appendChild(star);
            }

            const grid = document.getElementById('photosGrid');
            for (let i = 1; i <= 5; i++) {
                const img = document.createElement('img');
                img.src = 'photos/photo' + i + '.jpg';
                img.alt = '';
                grid.appendChild(img);
            }

            const hearts = ['❤', '💕', '✨', '🌸'];
            for (let i = 0; i < 15; i++) {
                const h = document.createElement('div');
                h.className = 'floating-heart';
                h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                h.style.left = Math.random() * 100 + '%';
                h.style.fontSize = (Math.random() * 1.5 + 0.8) + 'rem';
                h.style.animationDuration = (Math.random() * 15 + 15) + 's';
                h.style.animationDelay = Math.random() * 15 + 's';
                document.getElementById('hearts').appendChild(h);
            }

            document.getElementById('forYou').addEventListener('click', function() {
                window.open('https://open.spotify.com/playlist/0APmbBYm2ZSCUVCOrk3QAn?si=NrmsTLzMRaO0KnOAnRrsuQ&pi=SBYHFhhSRuumz', '_blank');
            });
        })();
    </script>
</body>
</html>
